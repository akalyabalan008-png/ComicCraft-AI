<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft - Comic Preview</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .details {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .details p {
            margin: 8px 0;
        }

        .panel {
            background: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .panel h2 {
            margin-top: 0;
        }

        .panel img {
            width: 100%;
            max-width: 700px;
            display: block;
            margin: 15px auto;
            border-radius: 10px;
        }

        .story {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 30px auto;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎨 ComicCraft - AI Comic Preview</h1>

    <div class="details">
        <p><strong>Character:</strong> {{ character_name }}</p>
        <p><strong>Setting:</strong> {{ setting }}</p>
        <p><strong>Tone:</strong> {{ tone }}</p>
        <p><strong>Art Style:</strong> {{ art_style }}</p>
    </div>


    <div class="story">
        <h2>📖 Generated Story</h2>

        {{ comic_story }}
    </div>


    {% for image in image_paths %}

    <div class="panel">

        <h2>Panel {{ loop.index }}</h2>

        <img src="{{ image }}" alt="Comic Panel {{ loop.index }}">

    </div>

    {% endfor %}


    <a href="/" class="back-button">Create Another Comic</a>

</div>

</body>
</html>
